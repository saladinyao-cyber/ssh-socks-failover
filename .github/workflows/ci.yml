name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Public-safety validator
        run: python tools/validate_public_repo.py
