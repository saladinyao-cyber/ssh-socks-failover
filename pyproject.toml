[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-socks-failover"
version = "0.1.0"
description = "Provider-neutral health checking and failover for SSH dynamic SOCKS5 tunnels"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "saladinyao-cyber"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
ssh-socks-failover = "ssh_socks_failover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
